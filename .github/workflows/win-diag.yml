name: win-diag

# Temporary Windows diagnostic: run each test module as its own job so the failing one is visible from the
# check-run conclusions (the authoring session cannot read Actions logs). Removed once the Windows failure is fixed.

on:
  push:
    branches:
      - "claude/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    name: win ${{ matrix.mod }}
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        mod:
          - smoke
          - fast
          - test_render
          - test_phase4_integration
          - test_transitions_audio
          - test_formats
          - test_deliver
          - test_editorial
          - test_qa
          - test_color
          - test_motion
          - test_text
          - test_sfx
          - test_capabilities
          - test_cli
          - test_repo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install FFmpeg
        if: matrix.mod != 'test_cli' && matrix.mod != 'test_repo'
        run: choco install ffmpeg --no-progress -y
      - name: Run
        shell: pwsh
        run: |
          if ("${{ matrix.mod }}" -eq "smoke") {
            $fake = Join-Path $env:RUNNER_TEMP "fakehome"
            New-Item -ItemType Directory -Force $fake | Out-Null
            $HOME = $fake
            $env:USERPROFILE = $fake
            & .\install.ps1
            if (-not (Test-Path (Join-Path $fake ".claude\skills\mh-video-editor-skill\SKILL.md"))) { throw "skill not installed" }
            if (-not (Test-Path (Join-Path $fake ".claude\agents\mh-video-editor.md"))) { throw "agent not installed" }
          } elseif ("${{ matrix.mod }}" -eq "fast") {
            python engine/tests/run_tests.py --fast
          } else {
            python engine/tests/run_tests.py -k ${{ matrix.mod }}
          }
