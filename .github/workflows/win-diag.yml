name: win-diag

# Temporary Windows diagnostic: reproduce the main job's three steps as separate jobs so the failing one is
# visible from the check-run conclusions (the authoring session cannot read Actions logs). Removed once green.

on:
  push:
    branches:
      - "claude/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    name: win ${{ matrix.mod }}
    runs-on: windows-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        mod: [gate_doctor, full_suite, main_smoke]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install FFmpeg
        run: choco install ffmpeg --no-progress -y
      - name: Doctor (exact main step)
        if: matrix.mod == 'gate_doctor'
        run: python engine/scripts/mh_video.py doctor
      - name: Full suite (exact main step)
        if: matrix.mod == 'full_suite'
        run: python engine/tests/run_tests.py --durations 15
      - name: Installer smoke (exact main step)
        if: matrix.mod == 'main_smoke'
        shell: pwsh
        run: |
          $fake = Join-Path $env:RUNNER_TEMP "fakehome"
          New-Item -ItemType Directory -Force $fake | Out-Null
          $HOME = $fake
          $env:USERPROFILE = $fake
          & .\install.ps1
          $global:LASTEXITCODE = 0
          if (-not (Test-Path (Join-Path $fake ".claude\skills\mh-video-editor-skill\SKILL.md"))) { throw "skill not installed" }
          if (-not (Test-Path (Join-Path $fake ".claude\agents\mh-video-editor.md"))) { throw "agent not installed" }
